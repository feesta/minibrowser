<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>mini</title>
<link rel="stylesheet" href="putty-ink.css">
<style>
  html, body { height: 100%; }
  body { background: var(--pl-bg); display: grid; place-items: center; }
  .pl-empty { text-align: center; display: grid; gap: 14px; justify-items: center; }
  .pl-empty p { margin: 0; color: var(--pl-ink-faint); padding: 0 40px; }
</style>
<body>
  <div class="pl-empty">
    <div class="pl-display">mini</div>
    <p>type a url or a file path in the bar above, then press return</p>
    <p>⌘L bar · ⌘R reload · ⌘[ back · ⌘] forward · ⌘Q quit</p>
  </div>
</body>
</html>
